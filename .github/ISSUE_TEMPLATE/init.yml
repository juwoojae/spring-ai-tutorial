name: "Init"
description: "프로젝트, 모듈, 개발 환경의 초기 구성에 사용합니다."
title: "Init: "
labels: ["Init"]
type: Task
body:
  - type: textarea
    id: overview
    attributes:
      label: "Issue 요약"
      placeholder: "예: 모니터링 모듈의 초기 구성을 추가합니다."
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: "Issue 상세"
      placeholder: "초기화 대상, 목적, 필요한 설정을 작성해 주세요."
  - type: textarea
    id: todo
    attributes:
      label: "To do"
      placeholder: "예: - [ ] 기본 디렉터리 구성"
