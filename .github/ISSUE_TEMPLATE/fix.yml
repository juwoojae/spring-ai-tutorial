name: "Bug Fix"
description: "버그 수정 작업에 사용합니다."
title: "Fix: "
labels: ["Fix"]
type: Task
body:
  - type: textarea
    id: overview
    attributes:
      label: "Issue 요약"
      placeholder: "예: 특정 조건에서 추천 결과가 중복되는 문제를 수정합니다."
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: "Issue 상세"
      placeholder: "재현 방법, 현재 동작, 기대 동작과 원인을 작성해 주세요."
  - type: textarea
    id: todo
    attributes:
      label: "To do"
      placeholder: "예: - [ ] 재현 테스트 작성"
