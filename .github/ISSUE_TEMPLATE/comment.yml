name: "Comment"
description: "주석 추가, 수정, 정리 작업에 사용합니다."
title: "Comment: "
labels: ["Comment"]
type: Task
body:
  - type: textarea
    id: overview
    attributes:
      label: "Issue 요약"
      placeholder: "예: 복잡한 비즈니스 로직에 설명 주석을 추가합니다."
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: "Issue 상세"
      placeholder: "주석이 필요한 이유와 대상 코드를 작성해 주세요."
  - type: textarea
    id: todo
    attributes:
      label: "To do"
      placeholder: "예: - [ ] 서비스 로직 주석 보완"
