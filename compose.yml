services:
  spring-ai:
    build: .
    container_name: spring-ai-tutorial
    restart: unless-stopped
    ports:
      - "8080:8080"
      - "9091:9091"
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY}
    networks:
      - spring-ai-tutorial

networks:
  spring-ai-tutorial:
    name: spring-ai-tutorial
    driver: bridge
